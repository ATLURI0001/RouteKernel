name: routekernel

x-demo: &demo
  build:
    context: ./apps/demo
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  edge:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-8080}:80"
      - "${EDGE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api-a: {condition: service_healthy}
      api-b: {condition: service_healthy}
      web: {condition: service_healthy}
      realtime: {condition: service_healthy}
    networks: [frontend, backend, observability]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  api-a:
    <<: *demo
    environment: {APP_ROLE: api, INSTANCE: api-a}

  api-b:
    <<: *demo
    environment: {APP_ROLE: api, INSTANCE: api-b}

  web:
    <<: *demo
    environment: {APP_ROLE: web, INSTANCE: web}

  realtime:
    <<: *demo
    environment: {APP_ROLE: realtime, INSTANCE: realtime}

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://edge:8081/stub_status"]
    restart: unless-stopped
    depends_on: [edge]
    networks: [observability]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [observability]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [observability]

networks:
  frontend: {}
  backend: {internal: true}
  observability: {internal: true}

volumes:
  prometheus_data: {}
  grafana_data: {}
