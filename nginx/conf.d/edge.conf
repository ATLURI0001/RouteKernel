# HTTP endpoint is intentionally only a redirect and local health surface.
server {
    listen 80 default_server;
    server_name _;
    # Port 8443 is exposed by the default development compose mapping.
    # For production 80/443, change this to https://$host$request_uri.
    return 308 https://$host:8443$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    # Enable HSTS only on a real HTTPS hostname after confirming rollout.

    limit_conn client_conn 50;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'routekernel ok\n';
    }

    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api_pool/;
    }

    location /ws/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://realtime_pool;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://web_pool;
    }
}

# Internal metrics/health endpoint: port not published to the host.
server {
    listen 8081;
    server_name _;
    access_log off;
    location = /health { return 200 'ok\n'; }
    location = /stub_status { stub_status; }
    location / { return 404; }
}
