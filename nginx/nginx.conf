user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # Log the upstream destination and timing; no request bodies or credentials.
    log_format edge '$remote_addr - $request_method $uri $status '
                    'rt=$request_time u=$upstream_addr urt=$upstream_response_time';
    access_log /var/log/nginx/access.log edge;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=client_conn:10m;
    limit_req_status 429;

    # Upstream services remain on the internal Docker backend network.
    upstream api_pool {
        least_conn;
        server api-a:8000 max_fails=3 fail_timeout=10s;
        server api-b:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream web_pool { server web:8000; keepalive 8; }
    upstream realtime_pool { server realtime:8000; keepalive 8; }

    # Proper upgrade header handling: don't force 'upgrade' on regular requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/conf.d/*.conf;
}
